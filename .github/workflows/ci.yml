name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 백엔드 (Ruff, 단위 테스트)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdef
      DB_USER: root
      DB_PASSWORD: ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: mysqlclient 빌드에 필요한 패키지
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev pkg-config
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -X utf8 manage.py test inventory --noinput

  frontend:
    name: 화면 (ESLint, 빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wms-frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src e2e --max-warnings=0
      - run: npm run build
